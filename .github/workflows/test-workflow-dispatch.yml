jobs:
  test-job:
    name: test-job
    runs-on: ubuntu-latest
    steps:
      - name: Print all workflow_dispatch inputs and count
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          echo "Raw inputs JSON:"
          echo "$INPUTS_JSON"
          echo

          echo "Inputs (key=value):"
          echo "$INPUTS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"'
          echo

          echo "Total inputs count:"
          echo "$INPUTS_JSON" | jq 'length'

      - name: List contents
        run: ls -la
